<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensaver Gallery</title>
<style>
  :root {
    --bg: #07041a;
    --panel: #120c2e;
    --line: #2a1f5a;
    --text: #ece8ff;
    --muted: #9a92c4;
    --cyan: #2ef6ff;
    --pink: #ff2bd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text); background: var(--bg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image:
      linear-gradient(to bottom, transparent 60%, rgba(255,43,214,.10)),
      radial-gradient(ellipse at 50% -10%, #2a1660 0%, transparent 60%);
    background-attachment: fixed;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 56px 16px 24px; }
  h1 {
    margin: 0; font: 700 clamp(34px, 6vw, 56px)/1.05 "Courier New", monospace;
    letter-spacing: 4px; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 12px var(--pink), 0 0 2px var(--pink);
  }
  header p { margin: 12px 0 0; color: var(--muted); max-width: 560px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 64px; }
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: var(--cyan); outline: none;
    box-shadow: 0 0 0 1px var(--cyan), 0 0 28px rgba(46,246,255,.25);
  }
  .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .thumb iframe {
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
    border: 0; transform-origin: 0 0; pointer-events: none;
  }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(7,4,26,.35); opacity: 0; transition: opacity .2s;
    font: 700 14px "Courier New", monospace; letter-spacing: 3px; color: #fff;
  }
  .card:hover .play, .card:focus-visible .play { opacity: 1; }
  .play span { border: 1px solid var(--cyan); padding: 10px 18px; border-radius: 999px; background: rgba(7,4,26,.7); text-shadow: 0 0 8px var(--cyan); }
  .info { padding: 16px 18px 18px; }
  .info h2 { margin: 0; font-size: 18px; }
  .info p { margin: 6px 0 12px; color: var(--muted); font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 12px "Courier New", monospace; color: var(--cyan); border: 1px solid #1d4b5c; border-radius: 999px; padding: 2px 10px; }
  .soon {
    display: grid; place-items: center; text-align: center; min-height: 260px;
    border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); padding: 24px;
    font: 14px "Courier New", monospace; letter-spacing: 2px;
  }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header>
  <h1>Screensavers</h1>
  <p>Small looping animations to leave running on a spare screen. Pick one to play it full screen.</p>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Add a screensaver: drop it in <code>screensavers/&lt;name&gt;/index.html</code> and add it to the list in this page.</footer>
<script>
// Add new screensavers here.
const SCREENSAVERS = [
  {
    slug: 'synth-day',
    title: 'Synth Day',
    description: 'A whole day in 60 seconds while an old man in a Tron suit plays the synth.',
    tags: ['60s loop', 'sound', 'synthwave'],
  },
];

const grid = document.getElementById('grid');
for (const s of SCREENSAVERS) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `screensavers/${s.slug}/`;
  a.innerHTML = `
    <div class="thumb">
      <iframe src="screensavers/${s.slug}/" loading="lazy" tabindex="-1" aria-hidden="true" title=""></iframe>
      <div class="play"><span>▶ PLAY</span></div>
    </div>
    <div class="info">
      <h2></h2><p></p>
      <div class="tags">${s.tags.map(() => '<span class="tag"></span>').join('')}</div>
    </div>`;
  a.querySelector('h2').textContent = s.title;
  a.querySelector('.info p').textContent = s.description;
  a.querySelectorAll('.tag').forEach((el, i) => { el.textContent = s.tags[i]; });
  grid.appendChild(a);
}
const soon = document.createElement('div');
soon.className = 'soon';
soon.textContent = 'MORE COMING SOON';
grid.appendChild(soon);

// scale each 1280×720 live preview to fit its card
const ro = new ResizeObserver(entries => {
  for (const e of entries) {
    const f = e.target.querySelector('iframe');
    f.style.transform = `scale(${e.contentRect.width / 1280})`;
  }
});
document.querySelectorAll('.thumb').forEach(t => ro.observe(t));
</script>
</body>
</html>
