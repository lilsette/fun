<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubist Day</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2238; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #hud {
    position: fixed; left: 22px; top: 18px; pointer-events: none;
    padding: 8px 16px 10px; background: #efe4c8; color: #1c140e;
    border: 3px solid #1c140e; transform: rotate(-3deg);
    font: italic 13px/1.3 Georgia, "Times New Roman", serif; letter-spacing: 2px;
    box-shadow: 6px 6px 0 rgba(28,20,14,.35);
  }
  #hud .time { font: 700 30px/1.1 Georgia, serif; letter-spacing: 2px; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font: italic 13px Georgia, serif; letter-spacing: 2px; color: #efe4c8;
    opacity: .85; transition: opacity 1s; pointer-events: none;
    text-shadow: 0 1px 3px #000; white-space: nowrap;
  }
  body.idle #hint { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="time" id="clock">04:00</div><div id="phase">night</div></div>
<div id="hint">click for sound · F for fullscreen</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clockEl = document.getElementById('clock');
const phaseEl = document.getElementById('phase');
const hintEl = document.getElementById('hint');

const DAY_MS = 60000;        // one full 24h day in 60 seconds
const START_HOUR = 4;        // open just before dawn
const STEP_MS = 250;
const INK = '#1c140e';

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const smooth = t => t * t * (3 - 2 * t);

// ---------- palettes: each time of day has 4 sky and 4 ground colors ----------
const PAL = {
  night: { sky: ['#1d2a4a', '#2b3b66', '#14203a', '#3a4a7a'], ground: ['#2a2238', '#3a2c40', '#1e1a2a', '#46364a'] },
  dawn:  { sky: ['#e89a6a', '#c96a5a', '#f2c58a', '#8a5a7a'], ground: ['#a87a5a', '#8a5a48', '#c89a6a', '#6a4a4a'] },
  day:   { sky: ['#7fb0d8', '#a8cbe0', '#5a8fc0', '#e8dcc0'], ground: ['#c8a46a', '#b08850', '#d8bc84', '#8a6a44'] },
  dusk:  { sky: ['#d0643a', '#a8443a', '#e8a05a', '#5a3a6a'], ground: ['#9a5a3a', '#7a4030', '#b8784a', '#5a3a3a'] },
};
for (const p of Object.values(PAL)) { p.sky = p.sky.map(hex); p.ground = p.ground.map(hex); }
const KEYS = [[0, 'night'], [5, 'night'], [6.2, 'dawn'], [8, 'day'], [16, 'day'], [18, 'dusk'], [19.8, 'night'], [24, 'night']];

function paletteAt(hour) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [h0, a] = KEYS[i], [h1, b] = KEYS[i + 1];
    if (hour >= h0 && hour <= h1) {
      const t = smooth((hour - h0) / (h1 - h0));
      return {
        sky: PAL[a].sky.map((c, j) => mix(c, PAL[b].sky[j], t)),
        ground: PAL[a].ground.map((c, j) => mix(c, PAL[b].ground[j], t)),
      };
    }
  }
  return PAL.night;
}

// ---------- shard field: a jittered triangle mesh that breathes ----------
let W, H, horizon, shards = [], grain, sunShape = [];

function makeScene() {
  horizon = H * 0.62;
  const cols = Math.max(6, Math.round(W / 95)), rows = Math.max(5, Math.round(H / 95));
  const pts = [];
  for (let r = 0; r <= rows; r++) {
    pts.push([]);
    for (let c = 0; c <= cols; c++) {
      const edgeX = c === 0 || c === cols, edgeY = r === 0 || r === rows;
      pts[r].push({
        x: c / cols * W + (edgeX ? 0 : (Math.random() - 0.5) * W / cols * 0.8),
        y: r / rows * H + (edgeY ? 0 : (Math.random() - 0.5) * H / rows * 0.8),
        ph: Math.random() * 6.28, amp: edgeX || edgeY ? 0 : 4 + Math.random() * 5,
      });
    }
  }
  shards = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e = pts[r + 1][c + 1];
    const tris = Math.random() < 0.5 ? [[a, b, e], [a, e, d]] : [[a, b, d], [b, e, d]];
    for (const tri of tris) {
      shards.push({ v: tri, ci: Math.floor(Math.random() * 4), hatch: Math.random() < 0.22, ang: Math.random() * Math.PI });
    }
  }
  // paper grain overlay
  grain = document.createElement('canvas');
  grain.width = grain.height = 160;
  const g = grain.getContext('2d'), id = g.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random() * 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22;
  }
  g.putImageData(id, 0, 0);
  sunShape = Array.from({ length: 9 }, (_, i) => [i / 9 * Math.PI * 2, 0.8 + Math.random() * 0.35]);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeScene();
}
addEventListener('resize', resize);
resize();

// ---------- music: Am G F Em on white keys ----------
// white-key index 0 = C2 on a 22-key keyboard
const DEG = [0, 2, 4, 5, 7, 9, 11];
const keyFreq = i => 440 * Math.pow(2, (36 + 12 * Math.floor(i / 7) + DEG[i % 7] - 69) / 12);
const CHORDS = [
  { bass: 5, arp: [12, 14, 16, 19] }, // Am
  { bass: 4, arp: [11, 13, 15, 18] }, // G
  { bass: 3, arp: [10, 12, 14, 17] }, // F
  { bass: 2, arp: [9, 11, 13, 16] },  // Em
];
const ARP = [0, 2, 1, 3, 0, 2, 1, 3, 3, 2, 1, 0, 1, 2, 3, 2];

let actx = null, master, delayNode, soundOn = false;
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.25;
  delayNode = actx.createDelay(); delayNode.delayTime.value = 0.5;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const wet = actx.createGain(); wet.gain.value = 0.3;
  delayNode.connect(fb); fb.connect(delayNode);
  delayNode.connect(wet); wet.connect(master);
  master.connect(actx.destination);
}
function voice(freq, dur, type, vol, cut) {
  const t = actx.currentTime;
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  f.type = 'lowpass'; f.Q.value = 2; f.frequency.value = cut;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(master); g.connect(delayNode);
  o.start(t); o.stop(t + dur + 0.05);
}

addEventListener('click', () => {
  if (!actx) initAudio();
  soundOn = !soundOn;
  soundOn ? actx.resume() : actx.suspend();
  hintEl.textContent = (soundOn ? 'click to mute' : 'click for sound') + ' · F for fullscreen';
});
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  }
});
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
}
addEventListener('mousemove', wake); wake();

// ---------- drawing helpers ----------
let light = [255, 255, 255], wobT = 0;
const tone = h => { const c = hex(h); return rgb(c.map((v, i) => Math.round(v * light[i] / 255))); };

function path(pts, wob = 0) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => {
    const dx = wob ? Math.sin(wobT * 1.7 + i * 2.1) * wob : 0;
    const dy = wob ? Math.cos(wobT * 1.3 + i * 1.7) * wob : 0;
    i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy);
  });
  ctx.closePath();
}
function poly(pts, fill, { wob = 1, ink = true } = {}) {
  path(pts, wob);
  ctx.fillStyle = fill; ctx.fill();
  if (ink) { ctx.strokeStyle = INK; ctx.stroke(); }
}
function limb(a, b, w, fill) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len * w / 2, ny = dx / len * w / 2;
  poly([[a[0] + nx, a[1] + ny], [b[0] + nx * 0.8, b[1] + ny * 0.8], [b[0] - nx * 0.8, b[1] - ny * 0.8], [a[0] - nx, a[1] - ny]], fill);
}

function drawShards(pal, t) {
  ctx.lineJoin = 'round';
  for (const s of shards) {
    const p = s.v.map(v => [v.x + Math.sin(t / 2200 + v.ph) * v.amp, v.y + Math.cos(t / 2600 + v.ph) * v.amp]);
    const cy = (p[0][1] + p[1][1] + p[2][1]) / 3;
    const set = cy < horizon ? pal.sky : pal.ground;
    path(p);
    ctx.fillStyle = rgb(set[s.ci]); ctx.fill();
    if (s.hatch) {
      ctx.save(); ctx.clip();
      const cx = (p[0][0] + p[1][0] + p[2][0]) / 3;
      ctx.translate(cx, cy); ctx.rotate(s.ang);
      ctx.strokeStyle = 'rgba(28,20,14,.28)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let k = -120; k <= 120; k += 7) { ctx.moveTo(k, -120); ctx.lineTo(k, 120); }
      ctx.stroke();
      ctx.restore();
    }
    path(p);
    ctx.strokeStyle = 'rgba(28,20,14,.55)'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawSunMoon(hour, el, t) {
  const rx = W * 0.44, ry = H * 0.48;
  const a = (hour - 6) / 12 * Math.PI;
  if (el > -0.15) {
    const x = W / 2 - Math.cos(a) * rx, y = horizon - Math.sin(a) * ry;
    const r = Math.min(W, H) * 0.07, rot = t / 9000;
    const warm = clamp(el / 0.45, 0, 1);
    // angular rays
    ctx.fillStyle = `rgba(255,226,140,${0.45 * warm + 0.15})`;
    for (let k = 0; k < 7; k++) {
      const ang = rot * 2 + k / 7 * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(ang - 0.12) * r, y + Math.sin(ang - 0.12) * r);
      ctx.lineTo(x + Math.cos(ang) * r * 2.6, y + Math.sin(ang) * r * 2.6);
      ctx.lineTo(x + Math.cos(ang + 0.12) * r, y + Math.sin(ang + 0.12) * r);
      ctx.fill();
    }
    const pts = sunShape.map(([ang, k]) => [x + Math.cos(ang + rot) * r * k, y + Math.sin(ang + rot) * r * k]);
    ctx.lineWidth = 3;
    poly(pts, rgb(mix(hex('#e0502a'), hex('#f6d860'), warm)), { wob: 0 });
    // split the disc into a lit and a shadowed plane
    const half = pts.slice(0, 5).concat([[x, y]]);
    poly(half, rgb(mix(hex('#b83a22'), hex('#f0a838'), warm)), { wob: 0 });
  }
  const am = ((hour - 18 + 24) % 24) / 12 * Math.PI;
  if (Math.sin(am) > -0.15) {
    const x = W / 2 - Math.cos(am) * rx, y = horizon - Math.sin(am) * ry * 0.9;
    const r = Math.min(W, H) * 0.06;
    const outer = [], inner = [];
    for (let k = 0; k <= 6; k++) {
      const ang = -Math.PI / 2 + k / 6 * Math.PI;
      outer.push([x + Math.cos(ang) * r, y + Math.sin(ang) * r]);
      inner.unshift([x + Math.cos(ang) * r * 0.3, y + Math.sin(ang) * r]);
    }
    ctx.lineWidth = 3;
    poly(outer.concat(inner), '#f2ead0', { wob: 0 });
  }
}

// key geometry on the synth (local figure units). The top face leans right,
// the front face leans left, so the keyboard is seen from two angles at once.
const NKEYS = 22, KB = { by: -166, fy: -142, b0: -130, b1: 150, f0: -150, f1: 130 };
const keyX = i => lerp(lerp(KB.b0, KB.f0, 0.5), lerp(KB.b1, KB.f1, 0.5), (i + 0.5) / NKEYS);

function figureLayout(t, state) {
  const s = Math.min(H / 680, W / 460);
  const beat = (t / 500) % 1;
  return {
    s, gx: W / 2, gy: H * 0.94,
    bob: Math.pow(1 - beat, 3) * 5,
    sway: Math.sin(t / 1000 * Math.PI) * 3,
    tilt: Math.sin(t / 1000 * Math.PI) * 0.05,
    hands: [-1, 1].map(side => {
      const sx = side * 48 + Math.sin(t / 1000 * Math.PI) * 3, sy = -238;
      const hx = side < 0 ? state.leftX : state.rightX;
      const hy = -156 - (side < 0 ? state.leftLift : state.rightLift);
      return { side, S: [sx, sy], E: [(sx + hx) / 2 + side * 30, (sy + hy) / 2 + 24], Hd: [hx, hy] };
    }),
  };
}

function drawFigure(L, state) {
  ctx.save();
  ctx.translate(L.gx, L.gy); ctx.scale(L.s, L.s);
  ctx.lineWidth = 2.6; ctx.lineJoin = 'round';

  // floor shadow plane
  poly([[-200, 4], [160, -6], [210, 14], [-170, 22]], 'rgba(28,20,14,.35)', { ink: false });

  // legs
  poly([[-34, -118], [-6, -118], [-10, -6], [-30, -6]], tone('#1a2440'));
  poly([[6, -118], [34, -118], [32, -6], [10, -6]], tone('#0f1628'));
  poly([[-38, -8], [-6, -8], [-4, 4], [-42, 4]], tone('#121212'));
  poly([[8, -8], [36, -8], [42, 4], [6, 4]], tone('#121212'));

  ctx.save(); ctx.translate(L.sway, 0);
  // torso in three planes
  poly([[-50, -246], [0, -254], [0, -112], [-44, -112], [-62, -170]], tone('#1a2440'));
  poly([[0, -254], [50, -246], [62, -170], [44, -112], [0, -112]], tone('#0f1628'));
  poly([[0, -254], [34, -160], [-20, -150]], tone('#2a3c66'));

  // head, tilted and bobbing, with front and profile views fused
  ctx.save(); ctx.translate(0, L.bob - 300); ctx.rotate(L.tilt); ctx.translate(0, 300);
  poly([[-10, -258], [10, -258], [12, -244], [-12, -244]], tone('#c98a5a'));
  poly([[-40, -312], [-52, -304], [-47, -288], [-38, -292]], tone('#d89a6a'));
  poly([[-34, -330], [-10, -346], [6, -344], [2, -256], [-18, -258], [-36, -280], [-40, -306]], tone('#e8b88a'));
  poly([[6, -344], [22, -340], [38, -318], [40, -296], [34, -272], [14, -256], [2, -256]], tone('#c98a5a'));
  poly([[-26, -334], [-8, -344], [-14, -326]], tone('#f6dcb4'), { ink: false });
  poly([[-40, -320], [-54, -312], [-45, -302], [-56, -294], [-41, -286]], tone('#f2efe6'));
  poly([[28, -314], [56, -290], [30, -284]], tone('#b8764a'));
  // brows
  poly([[-32, -318], [-20, -326], [-6, -318]], tone('#f2efe6'));
  poly([[14, -320], [30, -326], [34, -316]], tone('#f2efe6'));
  // beard and moustache
  poly([[-36, -284], [-20, -276], [-4, -280], [14, -272], [34, -282], [28, -250], [10, -232], [-6, -244], [-22, -236], [-32, -256]], tone('#f2efe6'));
  poly([[-6, -280], [14, -272], [10, -232], [-6, -244]], tone('#cfcac0'));
  poly([[-20, -282], [0, -290], [22, -282], [2, -277]], tone('#e4e0d6'));
  poly([[-6, -272], [10, -270], [2, -263]], tone('#c0392b'));
  ctx.restore(); // head
  ctx.restore(); // sway

  // keyboard stand
  ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-112, -2); ctx.lineTo(92, -124); ctx.moveTo(116, 2); ctx.lineTo(-86, -126); ctx.stroke();
  ctx.lineWidth = 2.6;

  // synth: control panel, top face, front face
  poly([[-122, -184], [146, -180], [KB.b1, KB.by], [KB.b0, KB.by]], tone('#8a2a2a'));
  poly([[KB.f0, KB.fy], [KB.f1, KB.fy], [140, -114], [-138, -120]], tone('#5a1a1e'));
  poly([[-138, -120], [-20, -118], [-40, -142], [KB.f0, KB.fy]], tone('#2a1418'), { ink: false });
  for (let k = 0; k < 5; k++) {
    const kx = -100 + k * 26, ky = -174;
    ctx.beginPath(); ctx.arc(kx, ky, 6, 0, 6.283);
    ctx.fillStyle = tone(k % 2 ? '#f2c58a' : '#2b3b66'); ctx.fill(); ctx.strokeStyle = INK; ctx.stroke();
  }
  poly([[40, -178], [118, -176], [120, -168], [42, -170]], tone('#14203a'), { wob: 0 });

  for (let i = 0; i < NKEYS; i++) {
    const u0 = i / NKEYS, u1 = (i + 1) / NKEYS;
    let fill = tone('#f2ead0');
    if (i === state.arpKey) fill = rgb(mix(hex('#e0502a'), hex('#f2ead0'), state.frac));
    if (i === state.bassKey) fill = rgb(mix(hex('#3a6ab8'), hex('#f2ead0'), state.bassFrac * 0.7));
    ctx.lineWidth = 1.6;
    poly([[lerp(KB.b0, KB.b1, u0), KB.by], [lerp(KB.b0, KB.b1, u1), KB.by], [lerp(KB.f0, KB.f1, u1), KB.fy], [lerp(KB.f0, KB.f1, u0), KB.fy]], fill, { wob: 0 });
  }
  for (let i = 0; i < NKEYS - 1; i++) {
    if (![0, 1, 3, 4, 5].includes(i % 7)) continue;
    const u = (i + 1) / NKEYS, w = 0.3 / NKEYS;
    const bx0 = lerp(KB.b0, KB.b1, u - w), bx1 = lerp(KB.b0, KB.b1, u + w);
    const mid = 0.55, my = lerp(KB.by, KB.fy, mid);
    const mx0 = lerp(bx0, lerp(KB.f0, KB.f1, u - w), mid), mx1 = lerp(bx1, lerp(KB.f0, KB.f1, u + w), mid);
    poly([[bx0, KB.by], [bx1, KB.by], [mx1, my], [mx0, my]], INK, { wob: 0, ink: false });
  }
  ctx.lineWidth = 2.6;

  // arms and angular hands
  for (const h of L.hands) {
    limb(h.S, h.E, 24, tone(h.side < 0 ? '#1a2440' : '#0f1628'));
    limb(h.E, h.Hd, 19, tone(h.side < 0 ? '#2a3c66' : '#1a2440'));
    const [x, y] = h.Hd;
    poly([[x - 12, y - 6], [x + 2, y - 11], [x + 13, y - 4], [x + 9, y + 6], [x - 8, y + 7]], tone(h.side < 0 ? '#e8b88a' : '#c98a5a'));
  }
  ctx.restore();
}

// Tron lines go on last, untouched by the evening light, so they glow at night.
function drawNeon(L, night) {
  ctx.save();
  ctx.translate(L.gx, L.gy); ctx.scale(L.s, L.s);
  ctx.strokeStyle = '#2ef6ff'; ctx.shadowColor = '#2ef6ff'; ctx.shadowBlur = 6 + 16 * night;
  ctx.lineWidth = 2.6; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  const line = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
  line([[-32, -114], [-26, -60], [-30, -10]]);
  line([[32, -114], [27, -60], [30, -10]]);
  line([[-38, 2], [-6, 2]]); line([[9, 2], [40, 2]]);
  ctx.save(); ctx.translate(L.sway, 0);
  line([[-30, -248], [-42, -200], [-28, -160], [-38, -116]]);
  line([[30, -248], [44, -196], [30, -158], [40, -116]]);
  line([[-14, -252], [0, -238], [14, -252]]);
  ctx.beginPath(); ctx.moveTo(0, -226); ctx.lineTo(12, -212); ctx.lineTo(0, -198); ctx.lineTo(-12, -212); ctx.closePath(); ctx.stroke();
  // visor: a frontal eye and a profile eye
  ctx.save(); ctx.translate(0, L.bob - 300); ctx.rotate(L.tilt); ctx.translate(0, 300);
  ctx.fillStyle = 'rgba(46,246,255,.85)';
  ctx.beginPath(); ctx.moveTo(-30, -308); ctx.lineTo(-18, -317); ctx.lineTo(-4, -308); ctx.lineTo(-18, -301); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, -317); ctx.lineTo(32, -311); ctx.lineTo(16, -304); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-17, -309, 3, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(22, -311, 2.5, 0, 6.283); ctx.fill();
  ctx.restore();
  ctx.restore();
  for (const h of L.hands) line([[h.S[0] + h.side * 7, h.S[1]], [h.E[0] + h.side * 9, h.E[1]], [h.Hd[0] + h.side * 6, h.Hd[1] - 9]]);
  ctx.restore();
}

let notes = [];
function drawNotes(dt) {
  ctx.lineWidth = 2; ctx.strokeStyle = INK;
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.life -= dt * 0.35; n.y -= n.vy * dt; n.rot += n.spin * dt;
    if (n.life <= 0) { notes.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, n.life * 1.5);
    ctx.translate(n.x + Math.sin(n.life * 5 + n.ph) * 8, n.y); ctx.rotate(n.rot); ctx.scale(n.size, n.size);
    ctx.lineWidth = 2 / n.size;
    ctx.fillStyle = n.col;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(5, 0); ctx.lineTo(0, 4); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.fillRect(3.5, -16, 1.6, 16);
    ctx.beginPath(); ctx.moveTo(5, -16); ctx.lineTo(11, -11); ctx.lineTo(5, -10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function phaseName(hour) {
  if (hour >= 5 && hour < 7) return 'sunrise';
  if (hour >= 7 && hour < 11.5) return 'morning';
  if (hour >= 11.5 && hour < 13) return 'noon';
  if (hour >= 13 && hour < 17) return 'afternoon';
  if (hour >= 17 && hour < 19) return 'sunset';
  if (hour >= 19 && hour < 22) return 'evening';
  return 'night';
}

// ---------- main loop ----------
const t0 = performance.now();
let last = t0, lastStep = -1, lastMinute = -1;
const hand = { leftX: keyX(5), rightX: keyX(12), prevL: keyX(5), prevR: keyX(12), bassStep: 0 };

function frame(now) {
  const t = Math.max(0, now - t0);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  wobT = t / 1000;
  const hour = (((t + START_HOUR / 24 * DAY_MS) % DAY_MS) / DAY_MS) * 24;
  const el = Math.sin((hour - 6) / 12 * Math.PI);          // sun elevation -1..1
  const day = clamp((el + 0.1) / 0.35, 0, 1);
  const night = 1 - day;
  const golden = clamp(1 - Math.abs(el) / 0.3, 0, 1);
  light = mix(mix([125, 135, 195], [255, 255, 255], day), [255, 205, 165], golden * 0.5);

  // sequencer
  const step = Math.floor(t / STEP_MS);
  const frac = (t % STEP_MS) / STEP_MS;
  const chord = CHORDS[Math.floor(step / 16) % CHORDS.length];
  const arpKey = chord.arp[ARP[step % 16]];
  if (step !== lastStep) {
    lastStep = step;
    hand.prevR = hand.rightX;
    if (step % 4 === 0) { hand.prevL = hand.leftX; hand.bassStep = step; }
    if (soundOn && actx) {
      voice(keyFreq(arpKey), 0.45, 'triangle', 0.3, 1800 + 2400 * day);
      if (step % 4 === 0) voice(keyFreq(chord.bass), 1.1, 'sine', 0.35, 900);
    }
    if (Math.random() < 0.3) {
      const L = figureLayout(t, { leftX: 0, rightX: 0, leftLift: 0, rightLift: 0 });
      notes.push({
        x: L.gx + keyX(arpKey) * L.s, y: L.gy - 200 * L.s,
        vy: 40 + Math.random() * 30, life: 1, ph: Math.random() * 6,
        rot: (Math.random() - 0.5) * 0.8, spin: (Math.random() - 0.5) * 1.2,
        size: (1.1 + Math.random() * 0.7) * L.s,
        col: ['#e0502a', '#f6d860', '#3a6ab8', '#f2ead0'][Math.floor(Math.random() * 4)],
      });
    }
  }
  const bassFrac = clamp((t - hand.bassStep * STEP_MS) / (STEP_MS * 4), 0, 1);
  hand.rightX = lerp(hand.prevR, keyX(arpKey), clamp(frac * 5, 0, 1));
  hand.leftX = lerp(hand.prevL, keyX(chord.bass), clamp(bassFrac * 8, 0, 1));
  const state = {
    step, frac, arpKey, bassKey: chord.bass, bassFrac,
    leftX: hand.leftX, rightX: hand.rightX,
    leftLift: Math.sin(bassFrac * Math.PI) * 3,
    rightLift: Math.sin(frac * Math.PI) * 5,
  };

  drawShards(paletteAt(hour), t);
  drawSunMoon(hour, el, t);
  const L = figureLayout(t, state);
  drawFigure(L, state);
  drawNeon(L, night);
  drawNotes(dt);

  ctx.fillStyle = ctx.createPattern(grain, 'repeat');
  ctx.fillRect(0, 0, W, H);

  const minute = Math.floor(hour * 60);
  if (minute !== lastMinute) {
    lastMinute = minute;
    clockEl.textContent = String(Math.floor(hour)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
    phaseEl.textContent = phaseName(hour);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
